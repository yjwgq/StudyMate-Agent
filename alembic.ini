# ============================================================
#  Alembic config - Personal Agent OS
#  (ASCII only: alembic reads this file with locale encoding,
#   non-ASCII comments break on GBK Windows terminals)
#
#  Usage (project root):
#      docker compose -f infra/docker-compose.dev.yml run --rm migrate
#      uv run alembic upgrade head
#
#  DB URL: env.py reads DATABASE_URL_MIGRATE (app_owner role) from env,
#  never hardcode secrets here.
# ============================================================

[alembic]
script_location = infra/alembic
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
